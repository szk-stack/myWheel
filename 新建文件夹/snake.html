<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>贪吃蛇 · Snake</title>
<style>
  :root{
    --bg:#0b0f19;
    --panel:#131a2a;
    --line:#1e2942;
    --text:#e6ecf7;
    --muted:#8b9ab5;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100vh; min-height:100dvh;
    background:radial-gradient(1100px 700px at 50% -15%, #17233d 0%, var(--bg) 62%);
    color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; padding:18px;
    user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  .head{width:100%;max-width:460px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;letter-spacing:.5px}
  .brand i{width:11px;height:11px;border-radius:4px;background:linear-gradient(135deg,#6ee7a0,#22c55e);box-shadow:0 0 14px rgba(74,222,128,.75)}
  .stats{display:flex;gap:8px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px 12px;min-width:76px;text-align:center}
  .stat b{display:block;font-size:17px;line-height:1.25;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--muted)}
  .stage{position:relative;width:100%;max-width:460px;aspect-ratio:1/1;border-radius:18px;overflow:hidden;
    background:#101728;border:1px solid var(--line);
    box-shadow:0 26px 60px -22px rgba(0,0,0,.85), inset 0 0 0 1px rgba(255,255,255,.02)}
  canvas{display:block;width:100%;height:100%}
  .overlay{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;
    background:rgba(9,13,22,.74);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    transition:opacity .18s ease}
  .overlay.hide{opacity:0;pointer-events:none}
  .overlay h2{margin:0 0 10px;font-size:23px;letter-spacing:.5px}
  .overlay p{margin:0;color:var(--muted);font-size:13px;line-height:2}
  .overlay b{color:#7ee7a8}
  kbd{display:inline-block;background:#1c2740;border:1px solid #2b3a5c;border-bottom-width:2px;border-radius:6px;
    padding:1px 6px;margin:0 1px;font:inherit;font-size:11px;color:#cfe0ff}
  .btn{margin-top:14px;border:0;border-radius:12px;padding:11px 24px;font-size:15px;font-weight:700;cursor:pointer;
    color:#06210f;background:linear-gradient(180deg,#6ee7a0,#22c55e);
    box-shadow:0 12px 26px -10px rgba(34,197,94,.85);transition:transform .08s ease}
  .btn:active{transform:translateY(1px) scale(.99)}
  .foot{color:var(--muted);font-size:12px;text-align:center}
  .pad{display:none;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,60px);gap:9px}
  .pad button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:15px;font-size:19px;cursor:pointer}
  .pad button:active{background:#20304d;transform:translateY(1px)}
  @media (hover:none) and (pointer:coarse){ .pad{display:grid} .foot{display:none} }
</style>
</head>
<body>

  <div class="head">
    <div class="brand"><i></i>贪吃蛇</div>
    <div class="stats">
      <div class="stat"><b id="score">0</b><span>得分</span></div>
      <div class="stat"><b id="best">0</b><span>最高分</span></div>
    </div>
  </div>

  <div class="stage" id="stage">
    <canvas id="game"></canvas>
    <div class="overlay" id="overlay">
      <div>
        <h2 id="ttl">贪吃蛇</h2>
        <p id="sub"></p>
        <button class="btn" id="actionBtn">开始游戏</button>
      </div>
    </div>
  </div>

  <div class="foot">手机可滑动屏幕，或用下方方向键控制</div>

  <div class="pad">
    <span></span><button data-dir="up" aria-label="上">▲</button><span></span>
    <button data-dir="left" aria-label="左">◀</button>
    <button data-dir="down" aria-label="下">▼</button>
    <button data-dir="right" aria-label="右">▶</button>
  </div>

<script>
(function () {
  const COLS = 20, ROWS = 20, CELL = 24;
  const W = COLS * CELL, H = ROWS * CELL;
  const BASE_INTERVAL = 145, MIN_INTERVAL = 70;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const ttlEl = document.getElementById('ttl');
  const subEl = document.getElementById('sub');
  const actionBtn = document.getElementById('actionBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');

  /* ---------- 自适应画布（高清屏） ---------- */
  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fit();

  /* ---------- 状态 ---------- */
  let snake, prevSnake, dir, queue, food, score, best, state, interval, acc;

  best = Number(localStorage.getItem('snake.best') || 0);
  bestEl.textContent = best;

  const DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
  };

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    prevSnake = snake.map(s => ({ x: s.x, y: s.y }));
    dir = DIRS.right;
    queue = [];
    score = 0;
    interval = BASE_INTERVAL;
    acc = 0;
    state = 'ready';
    updateHud();
    spawnFood();
    syncOverlay();
  }

  function spawnFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
      }
    }
    food = free.length ? free[(Math.random() * free.length) | 0] : null;
  }

  function updateHud() {
    scoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('snake.best', String(best)); } catch (e) {}
    }
  }

  /* ---------- 转向 ---------- */
  function turn(nd) {
    if (!nd) return;
    if (state === 'over' || state === 'win') reset();   // 结束后按方向键直接重开
    const ref = queue.length ? queue[queue.length - 1] : dir;
    if (nd.x === -ref.x && nd.y === -ref.y) return;  // 不能 180° 掉头
    if (nd.x === ref.x && nd.y === ref.y) return;    // 同方向忽略
    if (queue.length < 2) queue.push(nd);
    if (state === 'ready') start();
  }

  function start() {
    if (state === 'ready') { state = 'running'; acc = 0; prevSnake = snake.map(s => ({ x: s.x, y: s.y })); syncOverlay(); }
  }

  function togglePause() {
    if (state === 'running') { state = 'paused'; syncOverlay(); }
    else if (state === 'paused') { state = 'running'; syncOverlay(); }
    else if (state === 'ready') start();
    else if (state === 'over' || state === 'win') reset();
  }

  function die() {
    state = 'over';
    acc = interval;
    syncOverlay();
    updateHud();
  }

  /* ---------- 逻辑推进 ---------- */
  function step() {
    prevSnake = snake.map(s => ({ x: s.x, y: s.y }));

    while (queue.length) {
      const nd = queue.shift();
      if ((nd.x === -dir.x && nd.y === -dir.y) || (nd.x === dir.x && nd.y === dir.y)) continue;
      dir = nd; break;
    }

    const head = snake[0];
    const nx = head.x + dir.x, ny = head.y + dir.y;

    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) return die();  // 撞墙

    const grow = food && nx === food.x && ny === food.y;
    const limit = grow ? snake.length : snake.length - 1;
    for (let i = 0; i < limit; i++) {
      if (snake[i].x === nx && snake[i].y === ny) return die();      // 撞到自己
    }

    snake.unshift({ x: nx, y: ny });
    if (grow) {
      score += 10;
      interval = Math.max(MIN_INTERVAL, BASE_INTERVAL - Math.floor(score / 10) * 5);
      updateHud();
      if (snake.length === COLS * ROWS) { state = 'win'; acc = interval; syncOverlay(); return; }
      spawnFood();
    } else {
      snake.pop();
    }
  }

  /* ---------- 绘制 ---------- */
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    r = Math.min(r, w / 2, h / 2);
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function bodyColor(t) {                 // t: 0 头部 → 1 尾部
    return `hsl(${150 + t * 48}, ${78 - t * 30}%, ${58 - t * 20}%)`;
  }

  function segPos(i, t) {
    const cur = snake[i];
    const prev = prevSnake[i] || cur;
    return {
      x: (prev.x + (cur.x - prev.x) * t) * CELL,
      y: (prev.y + (cur.y - prev.y) * t) * CELL
    };
  }

  function draw(now) {
    const t = (state === 'over' || state === 'win') ? 1 : Math.min(1, acc / interval);

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#101728';
    ctx.fillRect(0, 0, W, H);

    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,.035)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) { ctx.moveTo(i * CELL + .5, 0); ctx.lineTo(i * CELL + .5, H); }
    for (let j = 1; j < ROWS; j++) { ctx.moveTo(0, j * CELL + .5); ctx.lineTo(W, j * CELL + .5); }
    ctx.stroke();

    // 食物
    if (food) {
      const cx = (food.x + .5) * CELL, cy = (food.y + .5) * CELL;
      const r = CELL * 0.3 * (1 + Math.sin(now / 220) * 0.07);
      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r * 2.6);
      glow.addColorStop(0, 'rgba(248,113,113,.32)');
      glow.addColorStop(1, 'rgba(248,113,113,0)');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(cx, cy, r * 2.6, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.beginPath(); ctx.arc(cx - r * .32, cy - r * .35, r * .24, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.ellipse(cx + r * .35, cy - r * .85, r * .34, r * .16, -0.7, 0, Math.PI * 2);
      ctx.fill();
    }

    // 蛇身（从尾到头）
    const n = snake.length;
    for (let i = n - 1; i >= 0; i--) {
      const p = segPos(i, t);
      const pad = 1.2, size = CELL - pad * 2;
      ctx.fillStyle = i === 0 ? 'hsl(150,85%,60%)' : bodyColor(i / Math.max(1, n - 1));
      if (i === 0) { ctx.shadowColor = 'rgba(74,222,128,.85)'; ctx.shadowBlur = 16; }
      rr(p.x + pad, p.y + pad, size, size, 8);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // 眼睛
    const hp = segPos(0, t);
    const hx = hp.x + CELL / 2, hy = hp.y + CELL / 2;
    const ox = dir.y !== 0 ? CELL * .2 : 0;
    const oy = dir.x !== 0 ? CELL * .2 : 0;
    const fx = dir.x * CELL * .14, fy = dir.y * CELL * .14;
    const eyes = [[hx + fx + ox, hy + fy + oy], [hx + fx - ox, hy + fy - oy]];
    for (const [ex, ey] of eyes) {
      ctx.fillStyle = '#06210f';
      ctx.beginPath(); ctx.arc(ex, ey, CELL * .115, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      ctx.beginPath();
      ctx.arc(ex - dir.x * 1.2 - 0.6, ey - dir.y * 1.2 - 0.6, CELL * .04, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ---------- 循环 ---------- */
  let lastTs = 0;
  function loop(now) {
    requestAnimationFrame(loop);
    if (!lastTs) lastTs = now;
    let dt = now - lastTs;
    lastTs = now;
    if (dt > 250) dt = 250;

    if (state === 'running') {
      acc += dt;
      let guard = 0;
      while (acc >= interval && state === 'running' && guard++ < 6) {
        acc -= interval;
        step();
      }
      if (state !== 'running') acc = interval;
    }
    if (acc > interval) acc = interval;

    draw(now);
  }

  /* ---------- 界面文案 ---------- */
  function syncOverlay() {
    if (state === 'running') { overlay.classList.add('hide'); return; }
    overlay.classList.remove('hide');

    if (state === 'ready') {
      ttlEl.textContent = '贪吃蛇';
      subEl.innerHTML = '方向键 / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 控制方向<br>空格键暂停 / 继续 · <kbd>R</kbd> 重新开始';
      actionBtn.textContent = '开始游戏';
    } else if (state === 'paused') {
      ttlEl.textContent = '已暂停';
      subEl.innerHTML = '按空格键或点下方按钮继续';
      actionBtn.textContent = '继续';
    } else if (state === 'over') {
      ttlEl.textContent = '游戏结束';
      subEl.innerHTML = `本局得分 <b>${score}</b> · 最高分 <b>${best}</b><br>共吃到 ${Math.floor(score / 10)} 个食物`;
      actionBtn.textContent = '再来一局';
    } else if (state === 'win') {
      ttlEl.textContent = '通关啦！';
      subEl.innerHTML = `蛇铺满了整个棋盘，得分 <b>${score}</b><br>你就是贪吃蛇之王 🐍`;
      actionBtn.textContent = '再玩一次';
    }
  }

  actionBtn.addEventListener('click', () => {
    if (state === 'paused') { state = 'running'; syncOverlay(); }
    else if (state === 'ready') start();
    else reset();
  });

  /* ---------- 键盘 ---------- */
  const KEYMAP = {
    arrowup: 'up', w: 'up', arrowdown: 'down', s: 'down',
    arrowleft: 'left', a: 'left', arrowright: 'right', d: 'right'
  };
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (KEYMAP[k]) { e.preventDefault(); turn(DIRS[KEYMAP[k]]); return; }
    if (k === ' ' || k === 'spacebar' || e.code === 'Space') { e.preventDefault(); togglePause(); return; }
    if (k === 'r') { reset(); }
  }, { passive: false });

  /* ---------- 触屏滑动 ---------- */
  let tsx = 0, tsy = 0, swiped = false;
  stage.addEventListener('touchstart', (e) => {
    const t = e.touches[0]; tsx = t.clientX; tsy = t.clientY; swiped = false;
  }, { passive: true });

  stage.addEventListener('touchmove', (e) => {
    if (swiped) return;
    const t = e.touches[0];
    const dx = t.clientX - tsx, dy = t.clientY - tsy;
    if (Math.hypot(dx, dy) < 22) return;
    swiped = true;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? DIRS.right : DIRS.left);
    else turn(dy > 0 ? DIRS.down : DIRS.up);
    e.preventDefault();
  }, { passive: false });

  /* ---------- 虚拟方向键 ---------- */
  document.querySelectorAll('.pad button').forEach(btn => {
    const fire = (e) => { e.preventDefault(); turn(DIRS[btn.dataset.dir]); };
    btn.addEventListener('touchstart', fire, { passive: false });
    btn.addEventListener('mousedown', fire);
  });

  /* ---------- 缩放 ---------- */
  window.addEventListener('resize', () => { fit(); draw(performance.now()); });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
