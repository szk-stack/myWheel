<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的第一个 Agent</title>
<style>
  /* ================= 页面基础 ================= */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex;          /* ★ 左右两栏布局：左侧对话列表 + 右侧聊天区 */
    overflow: hidden;
    background: #f2f4f8;
  }

  /* ================= 左侧栏：对话列表 ================= */
  #sidebar {
    width: 240px;
    flex-shrink: 0;
    background: #fff;
    border-right: 1px solid #e4e7ee;
    display: flex;
    flex-direction: column;
  }
  #newBtn {
    margin: 14px 12px;
    padding: 10px;
    border: 1px solid #4a7cff;
    border-radius: 10px;
    background: #fff;
    color: #4a7cff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #newBtn:hover { background: #eef3ff; }

  #convList {
    flex: 1;
    overflow-y: auto;       /* 对话多了可以滚动 */
    padding: 0 8px 12px;
    list-style: none;       /* 去掉圆点 */
  }
  .conv-item {
    display: flex;
    align-items: center;
    gap: 2px;
    padding: 9px 8px 9px 12px;
    margin-bottom: 4px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    color: #444;
  }
  .conv-item:hover { background: #f3f5fa; }
  .conv-item.active {         /* 当前打开的会话：高亮 */
    background: #e8eeff;
    color: #3b6ae8;
    font-weight: 600;
  }
  .conv-title {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;    /* 名字太长显示 … */
    white-space: nowrap;
  }
  .conv-item button {
    border: none;
    background: none;
    font-size: 13px;
    color: #888;
    padding: 2px 4px;
    border-radius: 4px;
    cursor: pointer;
    opacity: 0;                 /* 平时藏起来，鼠标移到这一行才出现 */
  }
  .conv-item:hover button { opacity: 1; }
  .conv-item button:hover { background: #dfe5f1; color: #333; }

  /* ================= 右侧：聊天主区域 ================= */
  #main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;               /* 配合 flex 使用，防止内容把布局撑破 */
  }
  #chatTitle {
    padding: 15px 20px;
    background: #fff;
    border-bottom: 1px solid #e4e7ee;
    font-weight: 600;
    color: #333;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg-wrap {
    display: flex;
    flex-direction: column;
    max-width: 78%;
  }
  .msg-wrap.user { align-self: flex-end; align-items: flex-end; }   /* 用户消息靠右 */
  .msg-wrap.ai { align-self: flex-start; }                          /* AI 消息靠左 */

  .msg {
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-wrap;      /* 保留 AI 回答里的换行 */
    word-break: break-word;
  }
  .msg.user {                  /* 用户的消息：右侧蓝色气泡 */
    background: #4a7cff;
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.ai {                    /* AI 的消息：左侧白色气泡 */
    background: #fff;
    color: #333;
    border: 1px solid #e4e7ee;
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }

  /* ===== 鼠标悬浮在 AI 消息上时，气泡下方浮现的按钮（分支功能） ===== */
  .msg-actions {
    margin-top: 4px;
    padding-left: 4px;
    opacity: 0;                 /* 平时完全透明 */
  }
  .msg-wrap:hover .msg-actions { opacity: 1; }   /* 悬浮时显示 */
  .msg-actions button {
    border: 1px solid #d8dce6;
    background: #fff;
    color: #666;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 6px;
    cursor: pointer;
  }
  .msg-actions button:hover {
    border-color: #4a7cff;
    color: #4a7cff;
    background: #f4f7ff;
  }

  /* ===== 工具调用相关（这次新加的） ===== */

  /* 流式过程中的临时状态行："正在调用 xxx…" */
  .tool-line {
    align-self: flex-start;
    font-size: 12px;
    color: #999;
    padding: 0 4px;
  }

  /* 正式的工具记录卡片（进入消息时间线，刷新后还在） */
  .tool-card {
    align-self: flex-start;
    max-width: 90%;
    font-size: 12px;
    color: #666;
    background: #f7f8fa;
    border: 1px solid #e4e7ee;
    border-radius: 8px;
    overflow: hidden;
  }
  .tool-card-head {
    padding: 6px 10px;
    cursor: pointer;              /* 提示可以点击 */
    user-select: none;            /* 点击时别把文字选中 */
  }
  .tool-card-head:hover { background: #eef1f6; }
  .tool-card-body {
    display: none;                /* 默认折叠，点击才展开 */
    padding: 8px 10px;
    border-top: 1px solid #e4e7ee;
    background: #fff;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 240px;
    overflow-y: auto;
    font-family: Consolas, "Courier New", monospace;
  }
  .tool-card.open .tool-card-body { display: block; }
  .tool-card.fail .tool-card-head { color: #c0392b; }
  .msg.error {                 /* 出错提示：浅红色气泡 */
    background: #fff5f5;
    border-color: #ffd9d9;
    color: #c0392b;
  }

  /* ================= 底部：输入区 ================= */
  footer {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    background: #fff;
    border-top: 1px solid #e4e7ee;
  }
  #input {
    flex: 1;
    border: 1px solid #d8dce6;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
    resize: none;
  }
  #input:focus { border-color: #4a7cff; }
  #btn {
    padding: 0 22px;
    border: none;
    border-radius: 10px;
    background: #4a7cff;
    color: #fff;
    font-size: 15px;
    cursor: pointer;
  }
  #btn:hover { background: #3b6ae8; }
  #btn:disabled { background: #a9bef5; cursor: not-allowed; }
</style>
</head>
<body>

  <!-- ===== 左侧栏：对话列表 ===== -->
  <aside id="sidebar">
    <button id="newBtn">＋ 新建对话</button>
    <ul id="convList"></ul>
  </aside>

  <!-- ===== 右侧：聊天主区域 ===== -->
  <main id="main">
    <header id="chatTitle">新对话</header>
    <div id="chat"></div>
    <footer>
      <textarea id="input" rows="1" placeholder="输入消息，按 Enter 发送（Shift+Enter 换行）"></textarea>
      <button id="btn">发送</button>
    </footer>
  </main>

<script>
// ============================================================
// 一、状态：页面上所有"会变的东西"都集中放在这里
// ------------------------------------------------------------
// 前端最重要的思想之一："状态驱动界面"——
//   数据变了 → 整个界面重新渲染。不要伸手去改页面的细节。
//
// 而"数据怎么记住"，本项目跟 Pi（github.com/earendil-works/pi）学的：
//   你在页面上的每个动作，都会被翻译成一条条【事件】，
//   只以"追加"的方式发给后端 → 后端把事件一行一行写进日志文件（data.jsonl）。
//   下次打开页面时，后端会"回放"整个日志，把状态推导出来再发给我们。
//
// 目前用到的事件类型（type 字段）：
//   session —— 新建了一个会话      { type:"session", id, title }
//              （分支出来的会话会多带 branched_from / branched_at 血缘备注）
//   message —— 新的一条消息        { type:"message", conversation_id, role, content }
//   tool    —— 一次工具调用记录    { type:"tool", conversation_id, name, arguments, result, ok }
//   rename  —— 会话改名            { type:"rename", id, title }
//   delete  —— 删除会话            { type:"delete", id }
//   switch  —— 切换当前会话        { type:"switch", id }
//
// 本页面的状态有三个：
//   state     —— 所有会话 + 当前打开哪个（会被记进日志，刷新不丢）
//   sending   —— 是否正在等 AI 回复（临时状态，刷新就重置）
//   errorText —— 错误信息（临时状态）
// ============================================================

const state = {
  conversations: [],   // 所有会话。每个会话长这样：{ id, title, messages: [...] }
  current_id: null,    // 当前打开的是哪个会话（记的是会话的 id）
};

let sending = false;     // 正在等 AI 回复吗？
let errorText = "";      // 有错误就存在这里，渲染时显示出来
let thinkingEl = null;   // "思考中…"那个气泡元素（流式回答就"长"在它身上）

// ---------- 先把页面上的元素抓在手里，后面反复要用 ----------
const convListEl = document.getElementById("convList");
const chatTitleEl = document.getElementById("chatTitle");
const chatBox = document.getElementById("chat");
const input = document.getElementById("input");
const btn = document.getElementById("btn");
const newBtn = document.getElementById("newBtn");

// ============================================================
// 二、和后端打交道的小函数
// ============================================================

// ★ 核心：把一批事件"追加"给后端
//   （后端只会往 data.jsonl 末尾加行，永远不会重写旧内容）
//   events 是一个数组，比如：
//     [{ type: "message", conversation_id: "c123", role: "user", content: "你好" }]
async function appendEvents(events) {
  console.log("[新事件]", events);   // 打开浏览器控制台（F12）能看到事件流，方便学习
  try {
    await fetch("/api/events", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ events: events }),
    });
  } catch (err) {
    // 发送失败也不让页面崩掉，只留个记录（比如后端没启动时会走到这）
    console.warn("事件追加失败：", err);
  }
}

// 取出"当前正在聊"的那个会话对象（找不到就返回 null）
function currentConv() {
  return state.conversations.find(function (c) { return c.id === state.current_id; });
}

// ============================================================
// 三、四个操作：新建 / 切换 / 删除 / 重命名
// ============================================================

// 【新建】造一个新会话，插到列表最前面，然后切过去
async function createConversation() {
  const conv = {
    id: "c" + Date.now(),    // 用当前时间戳当 id：简单，而且基本不可能重复
    title: "新对话",
    messages: [],
  };
  state.conversations.unshift(conv);   // unshift：插到数组最前面
  state.current_id = conv.id;

  // 记忆方式：把"新建"和"切换过去"记成两条事件，追加到日志
  await appendEvents([
    { type: "session", id: conv.id, title: conv.title },
    { type: "switch", id: conv.id },
  ]);

  renderAll();
  input.focus();           // 光标自动跳到输入框，马上能打字
}

// 【切换】点左侧列表里的某一项
async function switchConversation(id) {
  state.current_id = id;
  errorText = "";
  // 记住"最近打开的是哪个"：也记一条事件
  await appendEvents([{ type: "switch", id: id }]);
  renderAll();
}

// 【删除】
async function deleteConversation(id) {
  if (!confirm("确定要删除这个对话吗？删了就找不回来了。")) return;

  // filter：把要删的那个过滤掉，剩下的留下来
  state.conversations = state.conversations.filter(function (c) { return c.id !== id; });

  // "删除"也是一条事件——有意思的是：日志里原来的消息其实还在，
  // 只是回放时遇到 delete 事件就把这个会话忽略了（类似"划掉一笔账"）。
  await appendEvents([{ type: "delete", id: id }]);

  if (state.current_id === id) {
    // 删掉的正好是当前打开的会话
    if (state.conversations.length > 0) {
      state.current_id = state.conversations[0].id;   // 换到第一个
      await appendEvents([{ type: "switch", id: state.current_id }]);
    } else {
      // 一个都不剩了 → 自动建个新的（createConversation 里会记事件）
      await createConversation();
      return;
    }
  }

  renderAll();
}

// 【重命名】用浏览器自带的输入框弹窗（prompt），代码最少
async function renameConversation(id) {
  const conv = state.conversations.find(function (c) { return c.id === id; });
  const name = prompt("给这个对话起个新名字：", conv.title);
  // name 为 null 说明用户点了"取消"；为空说明什么都没输入 → 都不处理
  if (name && name.trim() !== "") {
    conv.title = name.trim();
    await appendEvents([{ type: "rename", id: id, title: conv.title }]);
    renderAll();
  }
}

// 【分支】以某条 AI 回复为界，复制出一个新会话（学 Pi 的 /fork）
// 原理：把"从开头到这条回复"的消息复制成新事件，追加进日志；
//       原会话一动不动，新会话拿到一份完全属于自己的历史副本。
async function branchConversation(sourceId, index) {
  const source = state.conversations.find(function (c) { return c.id === sourceId; });
  if (!source) return;

  // 要带走的家当：从第一条到这条 AI 回复（含它本身）
  const copied = source.messages.slice(0, index + 1);

  // 造一个新会话（消息逐条"复印"，和原会话彻底脱钩）
  const newConv = {
    id: "c" + Date.now(),
    title: source.title + "·分支",
    messages: copied.map(function (m) {
      return Object.assign({}, m);   // 浅拷贝一条新对象（tool 条目的字段也原样带上）
    }),
  };
  state.conversations.unshift(newConv);
  state.current_id = newConv.id;

  // 记账：1 条 session（带"从哪儿来"的血缘标记）+ 复印的所有条目
  // （branched_from / branched_at 只是备注，回放时会被忽略——旧代码天然兼容）
  const events = [
    {
      type: "session",
      id: newConv.id,
      title: newConv.title,
      branched_from: sourceId,   // 从哪个会话分支出来的
      branched_at: index,        // 分支点是第几条消息（从 0 数）
    },
  ];
  copied.forEach(function (m) {
    if (m.role === "tool") {
      // 工具记录也照原样复印一份
      events.push({
        type: "tool",
        conversation_id: newConv.id,
        name: m.name,
        arguments: m.arguments,
        result: m.result,
        ok: m.ok,
      });
    } else {
      events.push({
        type: "message",
        conversation_id: newConv.id,
        role: m.role,
        content: m.content,
      });
    }
  });

  await appendEvents(events);
  renderAll();
  input.focus();
}

// ============================================================
// 四、发送消息（核心流程）
// ============================================================
async function sendMessage() {
  const text = input.value.trim();
  if (!text || sending) return;      // 空消息 or 正在等回复 → 不理它

  const conv = currentConv();
  if (!conv) return;

  // 1. 用户的话先放进内存显示出来，清空输入框
  conv.messages.push({ role: "user", content: text });
  input.value = "";
  errorText = "";

  // 2. 进入"发送中"状态，并重新渲染（页面会显示"思考中…"气泡）
  sending = true;
  renderAll();

  // ★ 拿到"思考中…"气泡的引用：流式收到的每一段文字直接写在它身上
  //   （不做整页重绘——不然每来一个字就重建整个界面，会非常卡）
  const bubble = thinkingEl;
  let fullReply = "";      // 攒起来的完整回答
  const roundTools = [];   // 本轮用过的工具记录（流结束后要记账）
  const toolLines = [];    // 流式过程中"正在调用…"的临时状态行元素

  try {
    // 3. 调后端的流式聊天接口
    //    ★ 注意过滤：工具记录（role=tool）只是"给人看的账本"，
    //      发给模型时要去掉——模型的上下文里只有人话
    const historyForModel = conv.messages.filter(function (m) {
      return m.role !== "tool";
    });
    const res = await fetch("/api/chat/stream", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: historyForModel }),
    });
    if (!res.ok || !res.body) {
      throw new Error("服务未就绪（HTTP " + res.status + "），请重启 server.py 后再试");
    }

    // 4. 流式读取（和上一版一样：逐块读 + 缓冲区兜住"半行"）
    const reader = res.body.getReader();
    const decoder = new TextDecoder("utf-8");
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const payload = line.slice(6);
        if (payload === "[DONE]") continue;

        const msg = JSON.parse(payload);
        if (msg.error) throw new Error(msg.error);

        if (msg.type === "text") {
          // 一段回答文字 → 打字机效果
          fullReply += msg.text;
          bubble.textContent = fullReply;
          chatBox.scrollTop = chatBox.scrollHeight;

        } else if (msg.type === "tool_call") {
          // 模型要调工具了 → 在回答气泡上方加一行临时状态
          const lineEl = document.createElement("div");
          lineEl.className = "tool-line";
          lineEl.textContent = "正在调用工具 " + msg.name + " …";
          chatBox.insertBefore(lineEl, bubble.parentElement);
          toolLines.push(lineEl);
          chatBox.scrollTop = chatBox.scrollHeight;

        } else if (msg.type === "tool_result") {
          // 工具执行完了 → 更新那一行状态，并记录下来（结束后要记账）
          const lineEl = toolLines.shift();
          if (lineEl) {
            lineEl.textContent = "工具 " + msg.name + (msg.ok ? " 执行完成" : " 执行失败");
          }
          roundTools.push({
            name: msg.name,
            arguments: msg.arguments,
            result: msg.result,
            ok: msg.ok,
          });
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      }
    }

    // 5. 流正常结束 → 把工具记录和最终回答记进内存
    //    顺序就是实际发生顺序：…… → 工具们 → AI 的回答
    roundTools.forEach(function (t) {
      conv.messages.push({
        role: "tool",
        name: t.name,
        arguments: t.arguments,
        result: t.result,
        ok: t.ok,
      });
    });
    conv.messages.push({ role: "assistant", content: fullReply });

    // 6. 记账：把这一轮发生的事写成事件，一次性批量追加
    //    （user → tool…… → assistant；工具记录也进日志，方便回溯）
    const events = [
      { type: "message", conversation_id: conv.id, role: "user", content: text },
    ];
    roundTools.forEach(function (t) {
      events.push({
        type: "tool",
        conversation_id: conv.id,
        name: t.name,
        arguments: t.arguments,
        result: t.result,
        ok: t.ok,
      });
    });
    events.push({
      type: "message", conversation_id: conv.id, role: "assistant", content: fullReply,
    });
    if (conv.title === "新对话") {
      conv.title = text.slice(0, 12);   // 取前 12 个字当标题
      events.push({ type: "rename", id: conv.id, title: conv.title });
    }
    await appendEvents(events);

  } catch (err) {
    // 出错（没填 Key、网络断开、回答中途被打断……）：
    // 简化处理：该轮不记账，从内存里拿掉这句提问，显示错误提示。
    // （已经流出的半截内容、工具临时行，会被下一次重绘一起清掉）
    errorText = (err instanceof TypeError)
      ? "连不上后端服务，请确认 server.py 正在运行。"
      : (err.message || "连接出错");
    conv.messages.pop();
  }

  // 7. 收尾：退出发送状态，重新渲染
  //    （这时工具记录会变成正式的小卡片、回答气泡会被正式渲染替换）
  sending = false;
  renderAll();
  input.focus();
}

// ============================================================
// 五、渲染：根据上面的状态，把整个页面画出来
//     （任何时候状态变了，就调一次 renderAll，页面永远和状态一致）
// ============================================================
function renderAll() {
  renderSidebar();     // 左：对话列表
  renderMessages();    // 右：消息 + 标题
  btn.disabled = sending;   // 等回复时把发送按钮禁掉，防止重复发送
}

// ---------- 渲染左侧的对话列表 ----------
function renderSidebar() {
  convListEl.innerHTML = "";    // 先全部清空，再重新生成（简单直接，小项目够用）

  state.conversations.forEach(function (conv) {
    const li = document.createElement("li");
    li.className = "conv-item" + (conv.id === state.current_id ? " active" : "");
    li.addEventListener("click", function () { switchConversation(conv.id); });

    // 会话名字
    const title = document.createElement("span");
    title.className = "conv-title";
    title.textContent = conv.title;

    // 重命名小按钮（✎）
    const renameBtn = document.createElement("button");
    renameBtn.textContent = "✎";
    renameBtn.title = "重命名";
    renameBtn.addEventListener("click", function (e) {
      e.stopPropagation();   // ★ 阻止事件"冒泡"上去：不然会连带触发 li 的切换
      renameConversation(conv.id);
    });

    // 删除小按钮（✕）
    const delBtn = document.createElement("button");
    delBtn.textContent = "✕";
    delBtn.title = "删除";
    delBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      deleteConversation(conv.id);
    });

    li.appendChild(title);
    li.appendChild(renameBtn);
    li.appendChild(delBtn);
    convListEl.appendChild(li);
  });
}

// ---------- 渲染右侧的消息区 ----------
function renderMessages() {
  const conv = currentConv();

  // 标题栏显示当前会话的名字
  chatTitleEl.textContent = conv ? conv.title : "新对话";

  chatBox.innerHTML = "";       // 同样先清空

  // 把会话里的每条消息画成气泡（或工具卡片）
  if (conv) {
    conv.messages.forEach(function (msg, index) {
      if (msg.role === "tool") {
        // 工具记录：渲染成灰色小卡片（点击可展开看完整结果）
        addToolCard(msg);
      } else if (msg.role === "assistant") {
        // AI 的回复：附上"坐标"（哪个会话、第几条），悬浮按钮点它时才知道分支哪里
        addBubble("ai", msg.content, { convId: conv.id, index: index });
      } else {
        addBubble("user", msg.content);
      }
    });
  }

  // 空会话 → 显示一句欢迎语
  if (!conv || conv.messages.length === 0) {
    addBubble("ai", "你好！我是你的第一个 Agent。现在数据用「事件日志」来记（跟 Pi 学的），聊两句试试～");
  }

  // 正在等回复 → 显示"思考中…"（把元素引用记下来，流式回答会直接改它的文字）
  thinkingEl = null;
  if (sending) {
    thinkingEl = addBubble("ai", "思考中…");
  }

  // 有错误 → 用红色气泡显示
  if (errorText) {
    const div = addBubble("ai", "出错了：" + errorText);
    div.classList.add("error");
  }
}

// ---------- 把一条消息做成气泡，贴到消息区 ----------
// branchInfo（可选）：{ convId, index }。只有可分支的 AI 消息才传它，
// 传了就会在气泡下方挂一个"悬浮时才出现"的分支按钮。
function addBubble(role, text, branchInfo) {
  // 外层"壳"：负责悬浮探测（鼠标悬在上面时按钮才浮现）
  const wrap = document.createElement("div");
  wrap.className = "msg-wrap " + role;

  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;    // 用 textContent 而不是 innerHTML（更安全，不会被输入内容搞破坏）
  wrap.appendChild(div);

  // 可分支的消息：在气泡下方放一个按钮
  if (branchInfo) {
    const actions = document.createElement("div");
    actions.className = "msg-actions";
    const branchBtn = document.createElement("button");
    branchBtn.textContent = "分支新对话";
    branchBtn.addEventListener("click", function () {
      branchConversation(branchInfo.convId, branchInfo.index);
    });
    actions.appendChild(branchBtn);
    wrap.appendChild(actions);
  }

  chatBox.appendChild(wrap);
  chatBox.scrollTop = chatBox.scrollHeight;    // 自动滚动到最新消息
  return div;   // 返回气泡本身（"思考中…"改红色错误样式时要用它）
}

// ---------- 把一条"工具记录"做成灰色小卡片 ----------
// 点击卡片头部可以展开/收起完整结果
// （"默认折叠、想看了再展开"这个交互学自 Pi 的 Ctrl+O）
function addToolCard(tool) {
  const card = document.createElement("div");
  card.className = "tool-card" + (tool.ok ? "" : " fail");

  // 头部：一行摘要
  const head = document.createElement("div");
  head.className = "tool-card-head";
  const argsText = JSON.stringify(tool.arguments);   // 参数变成一小串文字
  head.textContent = "工具 " + tool.name + "(" +
    (argsText.length > 60 ? argsText.slice(0, 60) + "…" : argsText) +
    ") —— " + (tool.ok ? "成功（点击展开）" : "失败（点击展开）");

  // 身体：完整结果（默认折叠）
  const body = document.createElement("div");
  body.className = "tool-card-body";
  body.textContent = tool.result || "";

  // 点头部切换展开/收起
  head.addEventListener("click", function () {
    card.classList.toggle("open");
  });

  card.appendChild(head);
  card.appendChild(body);
  chatBox.appendChild(card);
  chatBox.scrollTop = chatBox.scrollHeight;
}

// ============================================================
// 六、启动：页面打开时，先读状态，再画出界面
// ============================================================
async function init() {
  // 1. 从后端读取状态
  //    （后端是"回放事件日志"推导出来的，对前端来说和以前一模一样，无感）
  try {
    const res = await fetch("/api/state");
    const data = await res.json();
    state.conversations = data.conversations || [];
    state.current_id = data.current_id || null;
  } catch (err) {
    console.warn("读取状态失败（后端没启动？）：", err);
    // 读不到也没关系，就用空数据继续
  }

  // 2. 一个会话都没有（第一次使用）→ 自动新建一个
  if (state.conversations.length === 0) {
    await createConversation();
    return;
  }

  // 3. 上次打开的会话如果不存在了（比如被删了）→ 打开第一个
  const exists = state.conversations.some(function (c) { return c.id === state.current_id; });
  if (!exists) state.current_id = state.conversations[0].id;

  renderAll();
}

// ---------- 事件绑定 ----------
newBtn.addEventListener("click", createConversation);
btn.addEventListener("click", sendMessage);
input.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// 出发！（脚本在 body 末尾，此时页面元素已经全部就绪）
init();
</script>
</body>
</html>
