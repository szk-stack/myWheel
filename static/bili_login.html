<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B站扫码登录</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #f5f6f8; color: #1f2329;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  .card {
    width: 380px; padding: 28px 24px 22px;
    background: #fff; border-radius: 14px;
    box-shadow: 0 8px 28px rgba(0,0,0,.08);
    text-align: center;
  }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 600; }
  .sub { font-size: 12px; color: #8a8f99; margin: 0 0 18px; }
  .qr {
    width: 260px; height: 260px; margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #eceef1; border-radius: 10px; padding: 10px; background: #fff;
  }
  .qr img { width: 100%; height: 100%; display: block; }
  .status { font-size: 14px; margin: 0 0 6px; min-height: 22px; }
  .status.ok { color: #17a34a; font-weight: 600; }
  .status.warn { color: #d97706; }
  .status.err { color: #dc2626; }
  .hint { font-size: 12px; color: #8a8f99; margin: 0; line-height: 1.6; }
  .again {
    margin-top: 12px; padding: 7px 16px; font-size: 13px;
    border: 1px solid #d0d3d8; border-radius: 7px; background: #fff;
    cursor: pointer; display: none;
  }
  .again:hover { background: #f7f8fa; }
</style>
</head>
<body>
  <div class="card">
    <h1>B站扫码登录</h1>
    <p class="sub">登录后 AI 字幕、UP 主作品列表都会稳定很多</p>
    <div class="qr"><img id="qr" src="/bili/login/qr.svg" alt="登录二维码"></div>
    <p class="status" id="status">正在获取二维码…</p>
    <p class="hint">用手机「B站」App 扫码<br>扫完记得在手机上点「确认登录」</p>
    <button class="again" id="again" onclick="location.reload()">二维码过期，点此刷新</button>
  </div>

<script>
  const el = document.getElementById('status');
  const again = document.getElementById('again');
  let done = false;

  function set(text, cls) {
    el.textContent = text;
    el.className = 'status' + (cls ? ' ' + cls : '');
  }

  async function tick() {
    if (done) return;
    try {
      const r = await fetch('/bili/login/status', { cache: 'no-store' });
      const d = await r.json();

      if (d.state === 'ok') {
        done = true;
        set('✅ 登录成功' + (d.uname ? '：' + d.uname : ''), 'ok');
        document.querySelector('.hint').textContent = '凭据已保存，可以关掉这个页面了';
        return;
      }
      if (d.state === 'scanned') { set('已扫码，请在手机上点「确认登录」', 'warn'); return; }
      if (d.state === 'expired') {
        done = true;
        set('二维码已过期', 'err');
        again.style.display = 'inline-block';
        return;
      }
      if (d.state === 'none') { set('正在获取二维码…'); return; }
      set('等待扫码…');
    } catch (e) {
      set('网络异常，重试中…', 'err');
    }
  }

  tick();
  setInterval(tick, 1500);
</script>
</body>
</html>
